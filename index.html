function signOut(){
  var go=function(){
    try{localStorage.removeItem(CHATKEY)}catch(e){}
    mq.turns=[];S=seed();S.me={nick:'',bio:''};S.pace='';save();obReset();pedit=false;lastSync='';
    renderOnb();
  };
  if(DB&&ME.id&&PEOPLE[ME.id]){delete PEOPLE[ME.id];queueWrite(function(){return DB.doc('profiles/'+ME.id).delete()})}
  go();
}
if(!S.acct)renderOnb();


/* ---------- Pontos e ranks ---------- */
var RANKS=[];
[['ini',0,'I'],['ini',334,'II'],['ini',667,'III'],['int',1000,'I'],['int',2333,'II'],['int',3667,'III'],['ava',5000,'I'],['ava',7000,'II'],['ava',9000,'III']].forEach(function(r){RANKS.push({t:r[0],min:r[1],d:r[2],n:LV[r[0]].n+' '+r[2]})});
var MILES=[[5,50,'5 km em uma corrida'],[10,100,'10 km em uma corrida'],[21,300,'Meia maratona (21 km)']];
var ptsOpen=false;
function fmtPts(n){return Math.round(n).toLocaleString('pt-BR')}
function earned(){
  var runs=S.runs.filter(function(r){return !r.ex}),o={km:0,plan:0,first:0,week:0,goal:0,mile:0};
  runs.forEach(function(r){o.km+=Math.round(r.km*10);if(r.pl)o.plan+=20});
  if(runs.length)o.first=20;
  var wk={};runs.forEach(function(r){var k=ymd(weekStart(pd(r.date)));(wk[k]=wk[k]||{})[r.date]=1});
  Object.keys(wk).forEach(function(k){if(Object.keys(wk[k]).length>=3)o.week+=30});
  var mk={};runs.forEach(function(r){var k=r.date.slice(0,7);mk[k]=(mk[k]||0)+r.km});
  Object.keys(mk).forEach(function(k){if(mk[k]>=goal(k).km)o.goal+=100});
  var mx=runs.reduce(function(m,r){return Math.max(m,r.km)},0);
  o.ms=MILES.map(function(m){return {km:m[0],pts:m[1],n:m[2],ok:mx>=m[0]}});
  o.ms.forEach(function(m){if(m.ok)o.mile+=m.pts});
  o.total=o.km+o.plan+o.first+o.week+o.goal+o.mile;
  return o;
}
function rankIdxFor(pts){var i=0;RANKS.forEach(function(r,k){if(pts>=r.min)i=k});return i}
function totalPts(){return Math.max(0,((S.acct&&S.acct.base)||0)+earned().total)}
function rankInfo(){
  var pts=totalPts(),idx=Math.max(rankIdxFor(pts),(S.acct&&S.acct.rank)||0),cur=RANKS[idx],nx=RANKS[idx+1];
  return {pts:pts,idx:idx,cur:cur,next:nx,pct:nx?Math.max(0,Math.min(1,(pts-cur.min)/(nx.min-cur.min))):1,left:nx?Math.max(0,nx.min-pts):0};
}
function rkBadge(idx,sz){
  var n=RANKS[idx].d==='I'?1:RANKS[idx].d==='II'?2:3,s='<svg class="rkb" width="'+sz+'" height="'+sz+'" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="var(--rk)" stroke-width="3"/>';
  for(var i=0;i<n;i++){var yb=31+(n-1)*3.5-i*7;s+='<path d="M14 '+yb+' L24 '+(yb-9)+' L34 '+yb+'" fill="none" stroke="var(--rk)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>'}
  return s+'</svg>';
}
function rkLine(ri){return ri.next?'Faltam '+fmtPts(ri.left)+' pts para '+ri.next.n:'Você está no nível mais alto.'}
function rankHomeCard(){
  if(!S.acct)return '';
  var ri=rankInfo();
  return '<section class="card rk rk-'+ri.cur.t+' rkhome" data-act="tab" data-v="perfil" data-sub="resumo" role="button" tabindex="0"><div class="rk-top">'+rkBadge(ri.idx,44)+'<div class="rk-mid"><div class="rk-row"><b class="rk-name">'+esc(ri.cur.n)+'</b><span class="rk-pts">'+fmtPts(ri.pts)+' pts</span></div><div class="bar"><i style="width:'+(ri.pct*100).toFixed(1)+'%"></i></div><small>'+rkLine(ri)+'</small></div></div></section>';
}
function pointsCard(){
  if(!S.acct)return '';
  var ri=rankInfo(),e=earned();
  var h='<section class="card rk rk-'+ri.cur.t+'"><span class="label">Pontuação</span><div class="rk-top">'+rkBadge(ri.idx,64)+'<div class="rk-mid"><b class="rk-name big">'+esc(ri.cur.n)+'</b><span class="rk-pts">'+fmtPts(ri.pts)+' pontos</span></div></div>';
  h+='<div class="bar"><i style="width:'+(ri.pct*100).toFixed(1)+'%"></i></div><p class="note">'+rkLine(ri)+'</p>';
  var parts=[['Km',e.km],['Treinos do plano',e.plan],['Constância',e.week],['Metas do mês',e.goal],['Marcos',e.mile+e.first]].filter(function(x){return x[1]>0});
  if(parts.length)h+='<div class="plansum">'+parts.map(function(x){return '<span>'+x[0]+' +'+fmtPts(x[1])+'</span>'}).join('')+'</div>';
  h+='<div><button class="btn small ghost" data-act="ptsopen">'+(ptsOpen?'Ocultar regras':'Como ganhar pontos')+'</button></div>';
  if(ptsOpen){
    h+='<ul class="rk-rules"><li><b>10 pontos</b> por km corrido</li><li><b>+20</b> por treino do plano concluído</li><li><b>+20</b> na sua primeira corrida</li><li><b>+30</b> por semana com 3 ou mais dias de corrida</li><li><b>+100</b> por meta mensal de km batida</li></ul>';
    h+='<span class="note">Marcos em uma única corrida</span><ul class="rk-rules">'+e.ms.map(function(m){return '<li class="'+(m.ok?'ok':'')+'">'+(m.ok?'✓ ':'')+m.n+' <b>+'+m.pts+'</b></li>'}).join('')+'</ul>';
    h+='<span class="note">Níveis</span><ul class="rk-rules"><li><b>Iniciante</b> de 0 a 999 pontos</li><li><b>Intermediário</b> de 1.000 a 4.999</li><li><b>Avançado</b> a partir de 5.000</li></ul><p class="note">Cada nível tem 3 divisões (I, II e III). Ao subir de nível, seu plano de treinos muda junto. Corridas de exemplo e de demonstração não pontuam.</p>';
  }
  return h+'</section>';
}
function showLvl(from,to,pts){
  var el=document.getElementById('lvl');if(!el)return;
  var up=from.t!==to.t,i=RANKS.indexOf(to),nx=RANKS[i+1],L=LV[to.t];
  var h='<div class="lv-in rk-'+to.t+'"><small class="lv-k">'+(up?'Novo nível':'Nova divisão')+'</small><div class="lv-badge">'+rkBadge(i,120)+'</div><h2>'+esc(to.n)+'</h2><p>Você chegou a '+fmtPts(pts)+' pontos.</p>';
  if(up)h+='<p>Seu plano de treinos agora é o '+L.n+'. Sugestão de meta: '+L.km+' km por mês.</p><button class="ob-btn" data-act="lvlgoal">Aplicar meta de '+L.km+' km</button><button class="ob-btn ghost" data-act="lvlplan">Ver meu plano</button>';
  else h+='<p>'+(nx?'Faltam '+fmtPts(nx.min-pts)+' pontos para '+esc(nx.n)+'.':'Você está no topo.')+' Continue assim.</p>';
  h+='<button class="ob-link" data-act="lvlclose">Continuar</button></div>';
  el.innerHTML=h;el.hidden=false;
}
function checkRank(){
  if(!S.acct||S.acct.base===undefined)return;
  var pts=totalPts(),idx=rankIdxFor(pts),prev=S.acct.rank||0;
  if(idx<=prev)return;
  var from=RANKS[prev],to=RANKS[idx];
  S.acct.rank=idx;if(from.t!==to.t)S.acct.level=to.t;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  showLvl(from,to,pts);
}
function setLevelManual(t){
  var idx=0;RANKS.forEach(function(r,k){if(r.t===t&&!idx&&r.d==='I')idx=k});
  S.acct.level=t;S.acct.rank=idx;S.acct.base=RANKS[idx].min-earned().total;
}
(function(){
  if(S.acct&&S.acct.base===undefined){
    S.acct.base=RANKS[RANKS.map(function(r){return r.t}).indexOf(S.acct.level)].min;
    S.acct.rank=rankIdxFor(totalPts());
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  }
  checkRank();
})();


applySettings();
render();
})();
</script>
<script>
/* Vida do app: toque com mola, ondinha, vibração leve, transição de abas e foto de perfil. */
(function(){
var NOMOTION=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var app=document.getElementById('app'),tabsEl=document.getElementById('tabs');
if(!app||!tabsEl)return;
function inLive(){var n=document.querySelector('nav');return !!(n&&n.hidden)}
function vibOn(){try{var s=JSON.parse(localStorage.getItem('passada.v2')||'{}');return !(s.set&&s.set.vib===false)}catch(e){return true}}
function tick(){if(!vibOn())return;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

/* ---------- Toque: aperta com mola, inclina para onde tocou, ondinha ---------- */
var cur=null,curBtn=null,rpTimer=0;
function pickTargets(t){
  if(!t||!t.closest)return[null,null];
  if(t.closest('input,textarea,select,a'))return[null,null];
  var btn=t.closest('button,.btn,.icon-btn,[role="button"]');
  var card=t.closest('.card');
  if(btn&&btn.classList.contains('card')){card=btn;btn=null}
  /* só cards clicáveis reagem ao toque; cards de informação ficam parados */
  if(card&&!(card.dataset.act||card.getAttribute('role')==='button'||card.tabIndex>=0&&card.hasAttribute('tabindex')))card=null;
  if(card&&card.querySelector('.tmap'))card=null;
  return[card,btn];
}
function ripple(el,x,y,big){
  if(NOMOTION)return;
  var r=el.getBoundingClientRect();if(r.width<2)return;
  var cs=getComputedStyle(el),box=document.createElement('div');
  box.className='rp-box';
  box.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;border-radius:'+cs.borderRadius;
  var d=Math.max(r.width,r.height)*(big?2.2:2.6),dot=document.createElement('span');
  dot.className='rp';dot.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(x-r.left-d/2)+'px;top:'+(y-r.top-d/2)+'px';
  box.appendChild(dot);document.body.appendChild(box);
  setTimeout(function(){box.remove()},650);
}
function release(){
  if(cur){cur.classList.remove('pressed');cur.style.removeProperty('--rx');cur.style.removeProperty('--ry');cur=null}
  if(curBtn){curBtn.classList.remove('pressed');curBtn=null}
}
document.addEventListener('pointerdown',function(e){
  if(inLive()||e.button>0)return;
  release();
  var t=pickTargets(e.target),card=t[0],btn=t[1];
  if(!card&&!btn)return;
  var inter=!!(btn||card&&card.dataset.act);
  if(btn){btn.classList.add('pressed');curBtn=btn;ripple(btn,e.clientX,e.clientY,false)}
  if(card&&!btn){
    var r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    if(!NOMOTION){card.style.setProperty('--ry',(px*7).toFixed(2)+'deg');card.style.setProperty('--rx',(-py*5).toFixed(2)+'deg')}
    card.classList.add('pressed');cur=card;ripple(card,e.clientX,e.clientY,true);
  }
  if(inter)tick();
  var av=e.target.closest&&e.target.closest('.av');if(av){av.classList.add('pressed')}
},{passive:true});
['pointerup','pointercancel','pointerleave','scroll','touchmove'].forEach(function(n){
  document.addEventListener(n,function(){release();var a=document.querySelector('.av.pressed');if(a)a.classList.remove('pressed')},{passive:true,capture:true});
});

/* ---------- Troca de aba / subtela: entrada em cascata ---------- */
var TABORDER=['home','agenda','run','prog','perfil'],lastTab=null,wantEnter=false,dir=0;
function curTab(){var b=tabsEl.querySelector('button.on');return b?b.dataset.v:'live'}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='tab'){var from=TABORDER.indexOf(curTab()),to=TABORDER.indexOf(b.dataset.v);dir=to>from?1:(to<from?-1:0);if(to!==from||b.dataset.sub)wantEnter=true}
  else if(a==='psub'||a==='pview'||a==='pback'||a==='pflt'){dir=a==='pback'?-1:1;wantEnter=true}
},true);

function animateEnter(){
  if(NOMOTION)return;
  var kids=[].slice.call(app.children).filter(function(k){return k.nodeType===1&&k.offsetHeight>0});
  var i=0,dx=(dir*28)+'px';
  function add(el){el.style.setProperty('--i',Math.min(i++,9));el.style.setProperty('--dx',dx);el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
  kids.forEach(function(k){
    if(k.classList.contains('grid2')){[].slice.call(k.children).forEach(add)}else add(k);
  });
  [].slice.call(app.querySelectorAll('.weeks i')).forEach(function(el,j){el.style.setProperty('--i',j);el.classList.remove('in-bar');void el.offsetWidth;el.classList.add('in-bar')});
  [].slice.call(app.querySelectorAll('.bar i')).forEach(function(el){el.classList.remove('in-barx');void el.offsetWidth;el.classList.add('in-barx')});
  [].slice.call(app.querySelectorAll('.ring .fg')).forEach(function(c){
    var full=c.getAttribute('stroke-dasharray'),real=c.getAttribute('stroke-dashoffset');
    if(!full||real===null)return;
    var f=parseFloat(full);if(!(f>0))return;
    c.style.transition='none';c.setAttribute('stroke-dashoffset',String(f));void c.getBoundingClientRect();
    c.style.transition='';requestAnimationFrame(function(){c.setAttribute('stroke-dashoffset',real)});
  });
}
var busy=false;
new MutationObserver(function(){
  if(busy)return;busy=true;
  var t=curTab();
  if(wantEnter||(lastTab!==null&&t!==lastTab&&t!=='live')){animateEnter();wantEnter=false}
  lastTab=t;
  busy=false;
}).observe(app,{childList:true});

/* ---------- Barra de abas: indicador que desliza + ícone que salta ---------- */
var lastIdx=-1;
function syncTabs(){
  var btns=[].slice.call(tabsEl.querySelectorAll('button')),idx=-1;
  btns.forEach(function(b,i){if(b.classList.contains('on'))idx=i});
  if(idx<0)return;
  tabsEl.style.setProperty('--i',idx);
  if(lastIdx!==-1&&idx!==lastIdx&&!NOMOTION){btns[idx].classList.add('pop')}
  lastIdx=idx;
}
new MutationObserver(syncTabs).observe(tabsEl,{childList:true});
syncTabs();


/* ---------- Finalizar corrida: segure por 1 segundo ---------- */
(function(){
  var timer=0,btn=null;
  function stop(){clearTimeout(timer);timer=0;if(btn){btn.classList.remove('holding');btn=null}}
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest&&e.target.closest('[data-act="livestop"]');if(!b)return;
    stop();btn=b;b.classList.add('holding');
    timer=setTimeout(function(){
      var x=btn;stop();if(!x)return;
      try{navigator.vibrate&&navigator.vibrate(40)}catch(er){}
      window.__held=true;x.click();
      var y=document.querySelector('[data-act="livestop"]');if(y)y.click();
      window.__held=false;
    },1000);
  },{passive:true});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){document.addEventListener(n,function(e){if(btn&&(n!=='pointerleave'||e.target===btn))stop()},{passive:true,capture:true})});
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-act="livestop"]');if(!b)return;
    if(window.__held||!e.isTrusted||e.detail===0)return;
    e.stopPropagation();e.preventDefault();
  },true);
  document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('[data-act="livestop"]'))e.preventDefault()});
})();

/* ---------- Foto do perfil: o input fica fora do #app e não some quando a tela é redesenhada ---------- */
var pf=document.getElementById('profile-photo-file');
document.addEventListener('keydown',function(e){var l=e.target&&e.target.classList&&e.target.classList.contains('lbl');if(l&&(e.key==='Enter'||e.key===' ')){e.preventDefault();var i=document.getElementById('profile-photo-file');if(i)i.click()}});
})();
</script>
