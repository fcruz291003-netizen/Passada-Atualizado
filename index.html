<title>Passada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular em coluna única, cabeçalho com troca de mês, conteúdo por aba e barra de abas fixa embaixo. */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --surface2:#E7EAE2; --fg:#13191C; --muted:#586469;
  --line:#D8DCD2; --accent:#D8431B; --accent-ink:#FFFFFF; --track:#1D4E5F; --ok:#2E7D4F; --e3:#B7791F; --e5:#A8200A;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1417; --surface:#182025; --surface2:#222C32; --fg:#EEF1EC; --muted:#93A0A6;
    --line:#2B363C; --accent:#FF6B3D; --accent-ink:#1A0D07; --track:#72B8CE; --ok:#5CC48A; --e3:#E3B341; --e5:#FF4D2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1417; --surface:#182025; --surface2:#222C32; --fg:#EEF1EC; --muted:#93A0A6;
  --line:#2B363C; --accent:#FF6B3D; --accent-ink:#1A0D07; --track:#72B8CE; --ok:#5CC48A; --e3:#E3B341; --e5:#FF4D2E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);font-variant-numeric:tabular-nums}
.shell{max-width:520px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 26px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.brand span{color:var(--accent)}
.month{display:flex;align-items:center;gap:4px}
.month b{font:600 18px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;min-width:112px;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font:600 13px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:700 44px/1 var(--font-display)}
.unit{font:600 16px/1 var(--font-display);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
.hero{flex-direction:row;align-items:center;gap:16px}
.ring{flex:none;width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .center b{font:700 34px/1 var(--font-display)}
.ring .center small{color:var(--muted);font-size:12px}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
@media (prefers-reduced-motion:reduce){.ring .fg,.bar i{transition:none}}
.hero .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .txt p{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:6px;padding:14px}
.stat b{font:700 28px/1 var(--font-display)}
.stat small{color:var(--muted);font-size:13px}
.weeks{display:flex;align-items:flex-end;gap:10px;height:120px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.weeks i{display:block;width:100%;background:var(--track);border-radius:6px 6px 2px 2px;min-height:3px}
.weeks span{font-size:12px;color:var(--muted);white-space:nowrap}
.weeks em{font:600 13px/1 var(--font-display);font-style:normal}
.coach{border-left:4px solid var(--accent);border-radius:4px 14px 14px 4px}
.coach p{font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .main{flex:1;min-width:0}
.item .main b{display:block;font:700 22px/1.1 var(--font-display);letter-spacing:.02em}
.item .main small{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2)}
.chip.ex{border-style:dashed}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.btn.danger{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
form,.form{display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input,select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit;min-height:44px}
.pace{font:700 22px/1 var(--font-display);color:var(--track)}
.err{color:var(--accent);font-size:14px;min-height:20px}
.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.bar.alt i{background:var(--track)}
.prog{display:flex;flex-direction:column;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal button{aspect-ratio:1/1;min-width:0;border:1px solid transparent;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-weight:500}
.cal button.today{border-color:var(--line);background:var(--surface2)}
.cal button.sel{border-color:var(--accent)}
.cal .dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.run{background:var(--accent)}
.dot.plan{border:2px solid var(--track)}
.dot.race{background:#F2B705;border-radius:2px}
.race .dname{font-size:20px}
.tmap{position:relative;width:100%;height:240px;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);margin:8px 0 4px;touch-action:pan-y}
.tmap img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
.tmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tmap svg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tmap svg .cs{stroke:#fff;stroke-width:8;opacity:.9}
.tmap svg .sg{stroke-width:4.5}
.tmap svg .mk{stroke:#fff;stroke-width:2.5}
.map-at{font-size:11px;opacity:.7;margin:0 0 6px}
.plwrap{position:relative}
.tmap.plmap{touch-action:none;height:280px;cursor:grab;margin-top:10px}
.plzoom{position:absolute;right:10px;top:18px;display:flex;flex-direction:column;gap:6px;z-index:3}
.plzoom button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 22px/1 var(--font-display);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.plpick{margin-top:10px}
.runstart{flex:1 1 100%;width:100%;min-height:88px!important;font-size:24px!important;border-radius:20px;letter-spacing:.02em;margin-top:8px;box-shadow:0 8px 24px rgba(224,69,27,.35)}
.runmore{margin-top:4px}
.runmore .btn{flex:1 1 0;white-space:nowrap;padding-left:8px;padding-right:8px}
.plhead{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;color:var(--fg);text-align:left;padding:2px 0;min-height:44px;cursor:pointer;font:inherit}
.plhead b{display:block;font-size:17px}
.plhead small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.plhead .chev{font-style:normal;font-size:26px;line-height:1;color:var(--muted);width:32px;text-align:center}
.plbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
.plbar .plpick{margin-top:0}
.plopts{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.plopts .plpace{margin-top:0;flex:1}
.plq{margin-top:10px}
.tmap.plmap{height:230px}
.plq{margin-top:12px}
.plqrow{display:flex;gap:8px;align-items:stretch}
.plqrow input{flex:1;min-width:0}
.plsug{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.plsug button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;font:500 14px/1.3 var(--font-body,inherit);cursor:pointer;min-height:44px}
.plrt{margin-top:14px;gap:12px}
.plpick button{display:inline-flex;align-items:center;gap:8px}
.plpick .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tmap svg .pln{stroke:#E0451B;stroke-width:3.5;stroke-dasharray:1 9;opacity:.95}
.tmap svg .plr{stroke:#E0451B;stroke-width:5}
#pl-out{margin-top:10px}
.actions[hidden],.btn[hidden]{display:none!important}
#pl-out .stats3 b{font-size:21px}
.plpace{margin-top:10px}

#cd{position:fixed;inset:0;z-index:970;background:rgba(9,10,11,.94);color:#EEF1EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#cd[hidden]{display:none}
#cd b{font:800 120px/1 var(--font-display,inherit)}
#cd small{font-size:16px;opacity:.7}
.tour ul{margin:8px 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.strat summary{cursor:pointer;font-weight:600;padding:8px 0}
.st-t>div{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
.st-t .st-h{font-size:12px;color:var(--muted);border-top:0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tip h3{font:700 22px/1.1 var(--font-display);letter-spacing:.02em}
.tip p{font-size:15px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px}
.note{font-size:13px;color:var(--muted)}
.run-dist{font:700 80px/1 var(--font-display);letter-spacing:.01em}
.run-time{font:700 40px/1 var(--font-display);color:var(--muted)}
.routebox{display:block;background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:100%;aspect-ratio:3/2}
.routebox polyline{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.routebox circle{fill:var(--track);stroke:var(--bg);stroke-width:2}
.banner{border-left:4px solid var(--track);border-radius:4px 14px 14px 4px}
.btn.big{min-height:56px;font-size:18px}
.btn.stop{background:var(--fg);color:var(--bg)}
.tc{text-align:center;align-items:center}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.type-btn b{font:700 19px/1.1 var(--font-display);letter-spacing:.02em}
.type-btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
.detail{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.detail p{font-size:14px}
.detail .row{flex-wrap:wrap}
.dname{font:700 24px/1 var(--font-display);letter-spacing:.02em}
.chip.ok{color:var(--ok);border-color:var(--ok);background:transparent}
.mq-head{flex-direction:row;align-items:center;gap:12px}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font:700 26px/1 var(--font-display)}
.mq-name{font:700 24px/1 var(--font-display);letter-spacing:.03em}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg .who{font:600 12px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--track);color:var(--bg)}
.act{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mq-bar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.mq-bar input{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
nav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;cursor:pointer;min-height:48px;border-radius:10px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#splash{position:fixed;inset:0;z-index:999;background:#090A0B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);transition:opacity .5s ease,visibility .5s;cursor:pointer;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#splash img{mix-blend-mode:lighten}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-p{width:min(62vw,300px);clip-path:inset(0 100% 0 0);transform:scale(.94);opacity:0;animation:spP .9s cubic-bezier(.2,.8,.2,1) .15s forwards}
#splash .sp-n{width:min(72vw,340px);opacity:0;transform:translateX(-26px);animation:spN .6s cubic-bezier(.2,.8,.2,1) .85s forwards}
#splash .sp-t{font:600 12px/1 var(--font-display);letter-spacing:.32em;text-transform:uppercase;color:#8A8F91;opacity:0;animation:spT .6s ease 1.5s forwards}
@keyframes spP{to{clip-path:inset(0 0 0 0);transform:none;opacity:1}}
@keyframes spN{to{opacity:1;transform:none}}
@keyframes spT{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .sp-p,#splash .sp-n,#splash .sp-t{animation:none;clip-path:none;transform:none;opacity:1}}
.sess{display:flex;flex-direction:column;gap:10px}
.sess .sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px}
.sess .sh b{font:700 22px/1 var(--font-display);letter-spacing:.02em}
.sess .sh span{font-size:13px;color:var(--muted)}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.sbar i{display:block;min-width:3px}
.seg{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:stretch;background:var(--surface);border-radius:10px;padding:10px 12px 10px 0;overflow:hidden}
.seg>i{display:block;border-radius:0 3px 3px 0}
.seg .st{min-width:0}
.seg .st b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.seg .st small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.seg .sv{text-align:right;white-space:nowrap}
.seg .sv b{display:block;font:700 20px/1.1 var(--font-display)}
.seg .sv small{display:block;font-size:12px;color:var(--muted)}
.e1{background:var(--track)}.e2{background:var(--ok)}.e3{background:var(--e3)}.e4{background:var(--accent)}.e5{background:var(--e5)}
.sess ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.sess .warn{font-size:13.5px;border-left:3px solid var(--e3);padding:6px 10px;background:var(--surface);border-radius:0 8px 8px 0}
.plansum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.plansum span{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.plansum span i{width:8px;height:8px;border-radius:50%;display:inline-block}

.seg .pc{display:inline-block;margin-top:6px;font:700 15px/1 var(--font-display);letter-spacing:.03em;color:var(--fg)}
.sess .ref{font-size:12px;color:var(--muted)}
.sess .warn.safe{border-left-color:var(--accent)}

.ph{display:flex;flex-direction:column;gap:14px;padding:4px 0 2px}
.ph-top{display:flex;align-items:center;gap:16px}
.av{flex:none;width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.avi{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font:700 38px/1 var(--font-display)}
.av.pav{width:46px;height:46px;font-size:22px}
.ph-name{font:700 30px/1.05 var(--font-display);letter-spacing:.02em;overflow-wrap:anywhere}
.ph-sub{color:var(--muted);font-size:16px;margin-top:2px}
.ph-cnt{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.ph-cnt button{background:none;border:0;color:var(--muted);font:inherit;padding:6px 0;cursor:pointer}
.ph-cnt b{color:var(--fg);font-weight:700}
.ph-bio{font-size:15px}
.ph-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.lbl{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.ptabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 0 10px;font:700 16px/1 var(--font-display);letter-spacing:.01em;color:var(--muted);cursor:pointer;padding-left:2px;padding-right:2px}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3.two{grid-template-columns:repeat(2,1fr)}
.stats3 small{display:block;color:var(--muted);font-size:13px}
.stats3 b{font:700 25px/1.15 var(--font-display);white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ar{fill:var(--accent);opacity:.16}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pl{fill:var(--accent);stroke:var(--accent);stroke-width:7;stroke-opacity:.25}
.chart .vl{stroke:var(--fg);stroke-width:1.5}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart text.ml{font-weight:600;text-anchor:middle}
.person{gap:10px}
.pmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.pmain .main{flex:1;min-width:0}

#onb{position:fixed;inset:0;z-index:900;background:#090A0B;color:#EEF1EC;overflow-y:auto;-webkit-overflow-scrolling:touch;--oa:#FF6B3D;--ol:#2B363C;--om:#93A0A6;--os:#14191C}
#onb[hidden]{display:none}
.ob-in{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px;min-height:100%}
.ob-logo{width:min(46vw,170px);align-self:flex-start;mix-blend-mode:lighten}
.ob-word{font:700 28px/1 var(--font-display);letter-spacing:.08em}
.ob-pips{display:flex;gap:6px}
.ob-pips i{width:28px;height:4px;border-radius:2px;background:var(--ol)}
.ob-pips i.on{background:var(--oa)}
#onb h1{font:700 34px/1.05 var(--font-display);letter-spacing:.02em;margin-top:6px}
.ob-sub{color:var(--om);font-size:15px}
.ob-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.ob-row .ob-f{flex:1}
.ob-f label{font-size:13px;font-weight:600;color:var(--om)}
#onb input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ol);background:var(--os);color:#EEF1EC;font:16px var(--font-body);padding:0 14px}
#onb input:focus{outline:2px solid var(--oa);outline-offset:1px;border-color:transparent}
.ob-at{display:flex;align-items:center;border:1px solid var(--ol);background:var(--os);border-radius:12px;padding-left:14px;color:var(--om)}
.ob-at input,#onb .ob-at input{border:0;background:transparent;padding-left:4px;min-height:46px;border-radius:0}
.ob-at:focus-within{outline:2px solid var(--oa);outline-offset:1px}
.ob-at input:focus{outline:0}
.ob-row{display:flex;gap:12px}
.ob-lv{display:flex;flex-direction:column;gap:8px}
.ob-lv button{text-align:left;border:1px solid var(--ol);background:var(--os);color:inherit;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ob-lv button b{font:700 20px/1.1 var(--font-display);letter-spacing:.02em}
.ob-lv button span{font-size:13.5px;color:var(--om)}
.ob-lv button.on{border-color:var(--oa);box-shadow:inset 0 0 0 1px var(--oa)}
.ob-err{color:#FF8A66;font-size:14px;min-height:20px}
.ob-btn{border:0;border-radius:12px;background:var(--oa);color:#1A0D07;font:700 20px/1 var(--font-display);letter-spacing:.04em;min-height:52px;cursor:pointer}
.ob-link{background:none;border:0;color:var(--om);font:600 15px var(--font-body);padding:10px;cursor:pointer}

.ob-det{border-left:3px solid var(--oa,var(--accent));padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:8px}
.ob-det p{font-size:14px;color:var(--om,var(--muted))}
.ob-det b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--oa,var(--accent));margin-bottom:1px}
.pe-det p{color:var(--muted)}
.pe-lv button{background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.pe-lv button span{color:var(--muted)}
.pe-lv button.on{border-color:var(--accent)}
.plrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plrow>b{font:700 20px/1 var(--font-display);letter-spacing:.04em}
.plrow .pt{display:block;font-weight:600;font-size:15px}
.plrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.plrow .pk{font:700 20px/1 var(--font-display);white-space:nowrap}

.rk{--rk:var(--track)}
.rk-ini{--rk:var(--track)}.rk-int{--rk:var(--e3)}.rk-ava{--rk:var(--accent)}
.rk-top{display:flex;align-items:center;gap:14px}
.rk-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rk-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rk-name{font:700 22px/1 var(--font-display);letter-spacing:.03em}
.rk-name.big{font-size:30px}
.rk-pts{color:var(--muted);font-weight:600;font-size:15px}
.rk .bar i{background:var(--rk)}
.rk small{color:var(--muted);font-size:13px}
.rkhome{cursor:pointer;gap:10px}
.rk-rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rk-rules li.ok{color:var(--ok)}
.chip.rk-ini,.chip.rk-int,.chip.rk-ava{border-color:var(--rk);color:var(--fg)}
.pos{font:700 22px/1 var(--font-display);width:22px;text-align:center;color:var(--muted)}
.person .pk{font:700 18px/1 var(--font-display);white-space:nowrap}
#lvl{position:fixed;inset:0;z-index:950;background:#090A0B;color:#EEF1EC;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px 20px}
#lvl[hidden]{display:none}
#art{position:fixed;inset:0;z-index:960;background:#090A0B;color:#EEF1EC;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#art[hidden]{display:none}
#art:not([hidden]),#lvl:not([hidden]){animation:ovUp .4s cubic-bezier(.2,.85,.25,1)}
@keyframes ovUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){#art,#lvl{animation:none!important}}
#dsheet{position:fixed;inset:0;z-index:880}
#dsheet[hidden]{display:none}
#rsheet{position:fixed;inset:0;z-index:890}
#rsheet[hidden]{display:none}
#rsheet.out{pointer-events:none}
#rsheet.fresh .ds-back{animation:dsFade .28s ease-out}
#rsheet.fresh .ds-panel{animation:dsUp .38s cubic-bezier(.2,.85,.25,1)}
#rsheet.out .ds-back{animation:dsFadeOut .25s ease-in forwards}
#rsheet.out .ds-panel{animation:dsDown .25s ease-in forwards}
.item .main[data-act=runopen]{cursor:pointer}
select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 12px;font:inherit;min-height:44px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:990;max-width:min(90vw,380px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical}
.shoe .bar{margin-top:6px}
.streak{flex-direction:row;align-items:center;justify-content:space-between}
.streak b{font:700 22px var(--font-display);letter-spacing:.02em}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach-i{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px;opacity:.55}
.ach-i.on{opacity:1;border-color:var(--accent)}
.ach-i i{font-style:normal;color:var(--accent);font-size:18px}
.ach-i b{font-size:14px}.ach-i small{font-size:12px;color:var(--muted)}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.tag.up{color:var(--accent);border-color:var(--accent)}
.tag.dn{color:var(--track);border-color:var(--track)}
.elev{display:block;width:100%;height:70px}
.elev polygon{fill:var(--accent);opacity:.16}
.elev polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.pv-box{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pv-box .row{align-items:flex-start;justify-content:space-between;gap:12px}
.pv-live .stats3 b{font-size:22px}
@keyframes dsUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes dsDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes dsFade{from{opacity:0}to{opacity:1}}
@keyframes dsFadeOut{from{opacity:1}to{opacity:0}}
.ds-panel.up{animation:dsUp .34s cubic-bezier(.22,.9,.3,1)}
.ds-back.fade{animation:dsFade .26s ease}
#dsheet.out .ds-panel{animation:dsDown .25s cubic-bezier(.5,0,.8,.4) forwards}
#dsheet.out .ds-back{animation:dsFadeOut .25s ease forwards}
#art.up{animation:dsUp .36s cubic-bezier(.22,.9,.3,1)}
#art.down{animation:dsDown .26s cubic-bezier(.5,0,.8,.4) forwards}
@media (prefers-reduced-motion:reduce){.ds-panel.up,.ds-back.fade,#art.up{animation:none}#dsheet.out .ds-panel,#dsheet.out .ds-back,#art.down{animation:none}}
.ds-back{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.ds-panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.ds-grip{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line)}
.ds-t{font:700 24px/1.1 var(--font-display);letter-spacing:.02em}
.sh-plan{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.art-in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.art-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#FF6B3D;font-weight:600}
.art-in h2{font:700 32px/1 var(--font-display);letter-spacing:.03em}
.art-seg{display:flex;gap:8px}
.art-seg button{border:1px solid #2B363C;background:transparent;color:#EEF1EC;border-radius:999px;padding:8px 16px;font:600 14px var(--font-body);cursor:pointer;min-height:40px}
.art-seg button.on{background:#EEF1EC;color:#090A0B;border-color:#EEF1EC}
.art-img{width:100%;max-width:340px;height:auto;border-radius:14px;border:1px solid #2B363C;display:block;-webkit-touch-callout:default;user-select:auto}
.art-img.ph{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:#93A0A6}
.art-act{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.art-act button{border:0;border-radius:12px;padding:14px 16px;font:600 16px var(--font-body);cursor:pointer;min-height:48px;background:#FF6B3D;color:#1A0D07}
.art-act button.ghost{background:transparent;color:#EEF1EC;border:1px solid #2B363C}
.art-act button:disabled{opacity:.5}
.art-link{background:none;border:0;color:#93A0A6;font:600 15px var(--font-body);padding:12px;min-height:44px;cursor:pointer;text-decoration:underline}
.art-ef{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px;align-items:center;color:#93A0A6}
.art-ef .filters{justify-content:center}
.art-ef .filters button{background:transparent;color:#EEF1EC;border-color:#2B363C}
.art-ef .filters button.on{background:#EEF1EC;color:#090A0B}
.art-msg,.art-hint{font-size:13px;color:#93A0A6}

.lv-in{max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;--oa:#FF6B3D}
.lv-in.rk-ini{--rk:#72B8CE}.lv-in.rk-int{--rk:#E3B341}.lv-in.rk-ava{--rk:#FF6B3D}
.lv-k{letter-spacing:.2em;text-transform:uppercase;color:var(--rk);font-weight:700;font-size:13px}
.lv-badge{animation:lvIn .7s cubic-bezier(.2,.9,.3,1.2) both;filter:drop-shadow(0 0 18px var(--rk))}
.lv-in h2{font:700 38px/1 var(--font-display);letter-spacing:.03em}
.lv-in p{color:#B9C2C6;font-size:15px}
.lv-in .ob-btn{width:100%}
.ob-btn.ghost{background:transparent;border:1px solid #2B363C;color:#EEF1EC}
@keyframes lvIn{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.lv-badge{animation:none}}

.nx{gap:12px}
.seg.mini{background:var(--surface2);padding:8px 12px 8px 0}
.seg.mini .st b{font-size:14.5px}
.seg.mini .pc{margin-top:3px;font-size:14px}
.seg.mini .sv b{font-size:18px}
.nx .stats3 b{font-size:22px}

/* ===== Vida: toque nos cards, entrada de telas e abas ===== */
.card,.btn,.icon-btn,nav button,.chip,.ph-cnt button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.card{transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,border-color .25s ease;transform-origin:center}
.card[data-act],.card[role="button"]{cursor:pointer}
.card.pressed{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(.975);transition-duration:.12s,.12s,.12s;border-color:var(--accent)}
.btn,.icon-btn,.ph-cnt button{transition:transform .4s cubic-bezier(.34,1.56,.64,1),filter .2s,background-color .2s}
.btn.pressed,.icon-btn.pressed,.ph-cnt button.pressed{transform:scale(.93);transition-duration:.1s;filter:brightness(.94)}
nav button{transition:color .25s,transform .4s cubic-bezier(.34,1.56,.64,1)}
nav button.pressed{transform:scale(.88);transition-duration:.1s}
.rp-box{position:fixed;z-index:60;pointer-events:none;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:var(--accent);opacity:.16;transform:scale(0);animation:rp .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
.in{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translate3d(var(--dx,0px),22px,0) scale(.97)}to{opacity:1;transform:none}}
.weeks i{transform-origin:50% 100%}
.in-bar{animation:growy .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + 250ms)}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar i{transform-origin:0 50%}
.in-barx{animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.25s}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.av{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.av.pressed{transform:scale(.92)}
#tabs{position:relative}
#tabs::before{content:"";position:absolute;top:-6px;left:0;height:3px;width:calc((100% - 6px)/4);border-radius:0 0 4px 4px;background:var(--accent);transform:translateX(calc(var(--i,0)*(100% + 2px)));transition:transform .45s cubic-bezier(.34,1.35,.64,1)}
nav button.pop svg{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.7) translateY(2px)}60%{transform:scale(1.25) translateY(-3px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.in,.in-bar,.in-barx,nav button.pop svg,.rp{animation:none!important}.card,.btn,.icon-btn,nav button,.av,#tabs::before{transition:none!important}.card.pressed{transform:none}}

/* ===== Treinador IA: balões com vida ===== */
.chat{gap:12px}
.mrow{display:flex;gap:8px;align-items:flex-end;min-width:0}
.mrow.me{justify-content:flex-end}
.mrow .msg{max-width:84%}
.mav{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--font-display);letter-spacing:.02em}
.msg{position:relative}
.msg.bot{border-bottom-left-radius:4px}
.msg.me{border-bottom-right-radius:4px;transform-origin:100% 100%}
.msg.bot{transform-origin:0 100%}
.msg.pop{animation:bubbleIn .5s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes bubbleIn{from{opacity:0;transform:translateY(16px) scale(.55)}to{opacity:1;transform:none}}
.msg.typing{padding:14px 16px}
.dots{display:inline-flex;gap:5px;align-items:center;height:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block;animation:dotb 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes dotb{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}
.msg.reveal .mbtns,.msg.reveal .act{display:none}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.mbtns .btn{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms + 80ms)}
.mchips button{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.avatar{position:relative}
.avatar .onl{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface);animation:onl 2s ease-in-out infinite}
@keyframes onl{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
@media (prefers-reduced-motion:reduce){.msg.pop,.dots i,.mbtns .btn,.mchips button,.avatar .onl{animation:none!important}}

/* ===== Layout v3 ===== */
.label{font-size:14px}
.note,.stat small,.stats3 small,.legend,.weeks span,.cal .dow,.ph-cnt{font-size:14px}
.chip{font-size:13px;padding:4px 11px}
.btn.small{min-height:40px;font-size:15px}
.icon-btn{width:44px;height:44px}
.empty{font-size:16px}
.msg .txt{font-size:16px}
nav div{grid-template-columns:repeat(5,1fr)}
nav button{font-size:13px;min-height:54px}
nav svg{width:24px;height:24px}
#tabs::before{width:calc((100% - 8px)/5)}
nav button.runbtn{overflow:visible;gap:0;color:var(--accent)}
nav button.runbtn .rb{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-30px;border:4px solid var(--surface);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
nav button.runbtn svg{fill:currentColor;stroke:none;width:26px;height:26px;margin-left:3px}
nav button.runbtn .t{font-weight:700;margin-top:2px}
nav button.runbtn.pressed .rb{transform:scale(.88)}
nav button.runbtn.pressed{transform:none}
.sic{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
.delta{color:var(--muted)}
.delta.ok{color:var(--ok)}
.delta.bad{color:var(--e5)}
.today .tt{font:700 34px/1.05 var(--font-display);letter-spacing:.01em}
.today .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today .actions .btn:only-child{grid-column:1/-1}
.ring .fg{stroke:url(#rgrad)}
.weeks .wk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0;background:none;border:0;padding:0;cursor:pointer;position:relative;font:inherit;color:inherit}
.weeks .wk i{transition:background-color .25s,transform .25s}
.weeks .wk.sel i{background:var(--accent)}
.weeks .wk.sel em{visibility:hidden}
.weeks .wk.sel::after{content:attr(data-tip);position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:5px 9px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap;z-index:2;animation:tipin .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes tipin{from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.8)}to{opacity:1;transform:translateX(-50%)}}
.emp{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px 0 2px;color:var(--muted);font-size:15px}
.emp svg{width:150px;height:75px;overflow:visible}
.emp .rd{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-dasharray:3 7;animation:dash 1.2s linear infinite}
.emp .rb{fill:var(--accent);offset-path:path('M4 46 C30 46 40 22 62 22 S96 46 116 40');offset-distance:0%;animation:ride 3s ease-in-out infinite alternate}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes ride{to{offset-distance:100%}}
.cal button.today{border-color:var(--accent);font-weight:700}
.cal .dot.plan{border:0}
.legend.gl{flex-wrap:wrap;gap:6px 14px;margin-top:-4px}
.avwrap{position:relative;flex:none}
.ph-top .av{width:96px;height:96px}
.cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.cam svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cam:active{transform:scale(.88)}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.plist button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line);font-weight:600;font-size:16px;text-align:left;min-height:52px;cursor:pointer}
.plist button:first-child{border-top:0}
.plist button i{font-style:normal;color:var(--muted);font-size:22px;line-height:1}
.plist button.pressed{background:var(--surface2)}
.ptabs{grid-template-columns:repeat(2,1fr);background:var(--surface2);border:0;border-radius:12px;padding:4px;gap:4px}
.ptabs button{border:0;border-radius:9px;padding:11px 0;transition:background-color .25s,color .25s,box-shadow .25s}
.ptabs button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#mqfab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:45;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
#mqfab[hidden]{display:none}
#mqfab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mqfab.pop{animation:fabin .55s cubic-bezier(.34,1.56,.64,1)}
#mqfab.pressed{transform:scale(.88)}
@keyframes fabin{from{opacity:0;transform:scale(.3) translateY(20px)}to{opacity:1;transform:none}}
.run-dist{font-size:112px}
.run-time{font-size:56px}
#lv-pace,#lv-avg{font-size:44px}
.btn.big{min-height:64px;font-size:19px}
.btn.stop{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.stop.holding::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:.55;transform-origin:0 50%;animation:holdfill 1s linear forwards}
@keyframes holdfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.emp .rd,.emp .rb,#mqfab.pop,.btn.stop.holding::after{animation:none!important}}
</style>

<script>
/* Ponte de localização: dentro do app Android usa o plugin nativo, que pede a permissão ao sistema. No navegador não faz nada. */
(function(){
  var C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  var G=(C.Plugins||{}).Geolocation;if(!G)return;
  var BG=(C.Plugins||{}).BackgroundGeolocation||null;
  if(!BG&&C.registerPlugin){try{BG=C.registerPlugin('BackgroundGeolocation')}catch(e){BG=null}}
  var LN=(C.Plugins||{}).LocalNotifications||null;
  function notifOk(){
    if(!LN)return Promise.resolve();
    return LN.checkPermissions().then(function(s){if(s&&s.display==='granted')return;return LN.requestPermissions()}).catch(function(){});
  }
  function conv(p){var c=p.coords||{};return {coords:{latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,altitude:c.altitude,altitudeAccuracy:c.altitudeAccuracy,heading:c.heading,speed:c.speed},timestamp:p.timestamp||Date.now()}}
  function code(e){var m=String(e&&(e.message||e)||'');return /denied|permiss|negad/i.test(m)?1:(/timeout|timed out/i.test(m)?3:2)}
  function ok(r){return r&&(r.location==='granted'||r.coarseLocation==='granted')}
  function perm(){return G.checkPermissions().then(function(s){if(ok(s))return s;return G.requestPermissions({permissions:['location']}).then(function(r){if(ok(r))return r;throw new Error('denied')})})}
  var ws={},wn=0;
  var geo={
    getCurrentPosition:function(good,bad,o){
      o=o||{};
      perm().then(function(){return G.getCurrentPosition({enableHighAccuracy:o.enableHighAccuracy!==false,timeout:o.timeout||15000,maximumAge:o.maximumAge||0})})
        .then(function(p){good(conv(p))},function(e){if(bad)bad({code:code(e),message:String(e&&e.message||e)})});
    },
    watchPosition:function(good,bad,o){
      o=o||{};var id=++wn;ws[id]={cb:null,off:false,bg:false};
      function startG(){
        /* timeout vira o intervalo das atualizações no Android (plugin 7.1+); o padrão antigo (20 s) deixava a distância atrasada */
        return G.watchPosition({enableHighAccuracy:o.enableHighAccuracy!==false,timeout:1000,maximumAge:0,minimumUpdateInterval:1000},function(p,e){
          if(e||!p){if(bad)bad({code:code(e),message:String(e&&e.message||e||'')});return}
          good(conv(p));
        }).then(function(cb){if(!ws[id]){try{G.clearWatch({id:cb})}catch(x){}return}ws[id].cb=cb;if(ws[id].off){try{G.clearWatch({id:cb})}catch(x){}}});
      }
      function startBG(){
        return BG.addWatcher({backgroundTitle:'Passada',backgroundMessage:'Corrida em andamento. Toque para voltar ao app.',requestPermissions:false,stale:false,distanceFilter:0},function(l,e){
          if(e||!l){if(bad)bad({code:(e&&e.code==='NOT_AUTHORIZED')?1:2,message:String(e&&e.message||'')});return}
          good({coords:{latitude:l.latitude,longitude:l.longitude,accuracy:l.accuracy,altitude:l.altitude,altitudeAccuracy:l.altitudeAccuracy,heading:l.bearing,speed:l.speed},timestamp:l.time||Date.now()});
        }).then(function(wid){
          if(!ws[id]){try{BG.removeWatcher({id:wid})}catch(x){}return}
          ws[id].cb=wid;ws[id].bg=true;
          if(ws[id].off){try{BG.removeWatcher({id:wid})}catch(x){}}
        });
      }
      perm().then(function(){
        if(ws[id]&&ws[id].off)return;
        if(o.background&&BG){
          return notifOk().then(function(){
            if(!ws[id]||ws[id].off)return;
            return startBG().catch(function(){if(ws[id]&&!ws[id].off)return startG()});
          });
        }
        return startG();
      }).catch(function(e){if(bad)bad({code:code(e),message:String(e&&e.message||e)})});
      return id;
    },
    clearWatch:function(id){var w=ws[id];if(!w)return;w.off=true;if(w.cb!=null){try{if(w.bg)BG.removeWatcher({id:w.cb});else G.clearWatch({id:w.cb})}catch(x){}}delete ws[id]}
  };
  try{Object.defineProperty(navigator,'geolocation',{value:geo,configurable:true})}catch(e){}
})();
</script>

function sayDur(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=[];if(h)p.push(h+(h===1?' hora':' horas'));if(m)p.push(m+(m===1?' minuto':' minutos'));if(x||!p.length)p.push(x+(x===1?' segundo':' segundos'));return p.join(' e ')}
function sayKm(d){return (d/1000).toFixed(2).replace('.',' vírgula ')+' quilômetros'}
var voicePt=null, voiceTest='', actx=null;

  }catch(e){}
}
try{if('speechSynthesis' in window){pickVoice();if(window.speechSynthesis.addEventListener)window.speechSynthesis.addEventListener('voiceschanged',pickVoice)}}catch(e){}
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state==='suspended')actx.resume();
    [0,0.22].forEach(function(dl){
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+dl;
      o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.14);

}
function say(txt,cb,o){
  try{
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){if(cb)cb('unsupported');return}
    var ss=window.speechSynthesis;
    if(ss.speaking||ss.pending)ss.cancel();
    if(ss.resume)ss.resume();
    var u=new SpeechSynthesisUtterance(txt),started=false;
    u.lang='pt-BR';u.rate=((o&&o.rate)||1)*((S.set&&S.set.vrate)||1);u.pitch=(o&&o.pitch)||1;if(voicePt)u.voice=voicePt;
    u.onstart=function(){started=true;if(cb)cb('ok')};

}
function speak(txt){
  run.banner=txt;
  try{if(S.set.vib&&navigator.vibrate)navigator.vibrate(run.prova?[180,80,180]:120)}catch(e){}
  if(voiceOn){
    beep();
    say(txt,function(s){
      if(s==='ok'){run.voiceMsg=''}
      else{run.voiceMsg='A voz do aparelho não respondeu. O bipe e o texto continuam avisando.'}
      updateLive();
    },run.prova?{rate:1.12,pitch:0.85}:null);

}
function sample(){
  run.samples.push({t:run.elapsed,d:run.dist});
  while(run.samples.length>2&&run.elapsed-run.samples[0].t>40)run.samples.shift();
}
function curPace(){
  var a=run.samples[0],b=run.samples[run.samples.length-1];
  if(!a||!b)return 0;
  var dd=b.d-a.d;
  return dd>=15?(b.t-a.t)/(dd/1000):0;
}

/* ---------- Relevo (subidas e descidas) ---------- */
function zSmooth(P){
  var n=P.length,out=new Array(n),i,j;
  for(i=0;i<n;i++){var a=Math.max(0,i-3),b=Math.min(n-1,i+3),s=0,c=0;for(j=a;j<=b;j++)if(P[j].z!=null){s+=P[j].z;c++}out[i]=c?s/c:null}
  return out;
}
function gainLoss(zs,from,to){
  var g=0,l=0,ref=null;
  for(var i=from;i<=to;i++){var z=zs[i];if(z==null)continue;if(ref===null){ref=z;continue}var df=z-ref;if(df>=3){g+=df;ref=z}else if(df<=-3){l+=-df;ref=z}}
  return {g:g,l:l};
}
function elevStats(){
  var P=run.pts,n=P.length,valid=P.filter(function(p){return p.z!=null}).length;
  if(n<5||valid<5)return {ok:false,kms:[]};
  var zs=zSmooth(P),tot=gainLoss(zs,0,n-1),kms=[],km=run.dist/1000,cnt=Math.floor(km),mn=1e9,mx=-1e9;
  zs.forEach(function(z){if(z!=null){if(z<mn)mn=z;if(z>mx)mx=z}});
  if(km-cnt>=0.2)cnt++;
  for(var k=1;k<=cnt;k++){
    var lo=(k-1)*1000,hi=k*1000,a=-1,b=-1;
    for(var i=0;i<n;i++){if(P[i].d>=lo&&a<0)a=i;if(P[i].d<=hi)b=i}
    if(a<0||b<=a){kms.push({n:0,g:0,l:0,t:'plano'});continue}
    var za=null,zb=null,i2;
    for(i2=a;i2<=b&&za==null;i2++)za=zs[i2];
    for(i2=b;i2>=a&&zb==null;i2--)zb=zs[i2];
    var gl=gainLoss(zs,a,b),net=(za!=null&&zb!=null)?zb-za:0;
    var t=net>=8?'subida':net<=-8?'descida':(gl.g+gl.l>=25?'ondulado':'plano');
    kms.push({n:Math.round(net),g:Math.round(gl.g),l:Math.round(gl.l),t:t});
  }
  return {ok:true,gain:Math.round(tot.g),loss:Math.round(tot.l),min:Math.round(mn),max:Math.round(mx),kms:kms};
}
function tagInfo(k){
  if(!k)return null;
  if(k.t==='subida')return {c:'up',txt:'▲ Subida +'+Math.abs(k.n)+' m'};
  if(k.t==='descida')return {c:'dn',txt:'▼ Descida −'+Math.abs(k.n)+' m'};
  if(k.t==='ondulado')return {c:'wv',txt:'Ondulado'};
  return {c:'fl',txt:'Plano'};
}
function kmElevTxt(k){
  var el=elevStats();if(!el.ok||!el.kms[k-1])return '';
  var e=el.kms[k-1];
  if(e.t==='subida')return ' Este quilômetro teve subida de '+Math.abs(e.n)+' metros. Segure o esforço, não o pace.';
  if(e.t==='descida')return ' Este quilômetro teve descida de '+Math.abs(e.n)+' metros. Aproveite sem estourar as pernas.';
  if(e.t==='ondulado')return ' Terreno ondulado neste quilômetro.';
  return '';
}
/* reamostra o percurso em passos regulares: [x,y,z] a cada rs metros */
function routeSample(){
  var P=run.pts,n=P.length;if(n<4||!(run.dist>50))return null;
  var zs=zSmooth(P),st=Math.max(25,Math.ceil(run.dist/250/25)*25),out=[],j=1,lastZ=null;
  for(var d=0;d<=run.dist;d+=st){
    while(j<n-1&&P[j].d<d)j++;
    var a=P[j-1],b=P[j],span=Math.max(b.d-a.d,0.001),f=Math.min(1,Math.max(0,(d-a.d)/span));
    var za=zs[j-1],zb=zs[j],z=(za!=null&&zb!=null)?za+(zb-za)*f:(zb!=null?zb:za);
    if(z!=null)lastZ=z;
    out.push([Math.round(a.x+(b.x-a.x)*f),Math.round(a.y+(b.y-a.y)*f),z!=null?Math.round(z*10)/10:null]);
  }
  var L=P[n-1];out.push([Math.round(L.x),Math.round(L.y),zs[n-1]!=null?Math.round(zs[n-1]*10)/10:lastZ]);
  return {rt:out,rs:st};
}
/* classe de cada trecho: u subida, d descida, f plano */
function slopeCls(rt,rs){
  var n=rt.length,out=[''];
  if(!rs||rt.some(function(p){return p[2]==null}))return null;
  for(var i=1;i<n;i++){
    var a=Math.max(0,i-3),b=Math.min(n-1,i+2),g=(rt[b][2]-rt[a][2])/Math.max((b-a)*rs,1);
    out.push(g>0.03?'u':g<-0.03?'d':'f');
  }
  return out;
}
var SLOPE_COL={u:'#FF6B3D',d:'#5BC0EB',f:'#C9D1D3'};
function routeSVG(rt,rs){
  var xs=rt.map(function(p){return p[0]}),ys=rt.map(function(p){return p[1]});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  var w=Math.max(x1-x0,30),h=Math.max(y1-y0,30),pad=16,sc=Math.min((300-2*pad)/w,(200-2*pad)/h);
  var ox=(300-w*sc)/2-x0*sc,oy=(200-h*sc)/2+y1*sc;
  function P(p){return (p[0]*sc+ox).toFixed(1)+','+(oy-p[1]*sc).toFixed(1)}
  var cls=slopeCls(rt,rs),s='<svg class="routebox" viewBox="0 0 300 200" role="img" aria-label="Percurso colorido por subidas e descidas">';
  if(cls){for(var i=1;i<rt.length;i++)s+='<polyline style="stroke:'+SLOPE_COL[cls[i]]+'" points="'+P(rt[i-1])+' '+P(rt[i])+'"/>'}
  else s+='<polyline points="'+rt.map(P).join(' ')+'"/>';
  s+='<circle style="fill:var(--ok)" r="6" cx="'+P(rt[0]).split(',')[0]+'" cy="'+P(rt[0]).split(',')[1]+'"/><circle r="6" cx="'+P(rt[rt.length-1]).split(',')[0]+'" cy="'+P(rt[rt.length-1]).split(',')[1]+'"/></svg>';
  return s;
}
function elevSVG(rt){
  var z=rt.map(function(p){return p[2]});if(z.some(function(v){return v==null})||z.length<3)return '';
  var mn=Math.min.apply(null,z),mx=Math.max.apply(null,z),rg=Math.max(mx-mn,6),W=300,H=70,n=z.length;
  var pts=z.map(function(v,i){return (i*W/(n-1)).toFixed(1)+','+(H-6-(v-mn)/rg*(H-18)).toFixed(1)});
  return '<svg class="elev" viewBox="0 0 300 70" role="img" aria-label="Perfil de altitude do percurso"><polygon points="0,'+H+' '+pts.join(' ')+' '+W+','+H+'"/><polyline points="'+pts.join(' ')+'"/></svg>';
}

var PVM={on:false,km:'10',dur:'55:00',strat:false},pvUser=false;
try{if(S.prova){PVM.km=S.prova.km||PVM.km;PVM.dur=S.prova.dur||PVM.dur}}catch(e){}
function pvNum(){return {k:num(PVM.km),s:parseDur(PVM.dur)}}
function pvState(){
  var P=run.prova,idealD=pvDAt(P,run.elapsed);
  var rem=P.km*1000-run.dist,remT=P.sec-run.elapsed;
  return {ideal:idealD,dsec:pvTAt(P,run.dist)-run.elapsed,req:(rem>20&&remT>0)?remT/(rem/1000):0,rem:rem};
}
function pvSecs(n){n=Math.round(n);return n<60?n+(n===1?' segundo':' segundos'):sayDur(n)}
function pvVerdict(){
  var P=run.prova,st=pvState(),d=st.dsec,a=pvSecs(Math.abs(d));
  var req=st.req>0&&st.req<P.pace*1.6?' Você precisa de '+sayDur(st.req)+' por quilômetro até o fim.':'';
  if(d>20)return 'Você está '+a+' à frente do plano. Controle esse ritmo! Quem abre rápido demais quebra no final. Segure o pace de '+sayDur(pvPaceAt(P,run.dist))+'.';
  if(d>5)return 'Você está '+a+' à frente. Mantenha, não acelere.';
  if(d>=-5)return 'No tempo ideal. Mantenha exatamente este ritmo.';
  if(d>=-20)return 'Você está '+a+' atrás. Acelere agora!'+req;
  return 'Atenção! '+a+' atrás do plano. Acelere já! Sem desculpas.'+req;
}
function pvDist(d){return d<1000?(Math.round(d/10)*10)+' metros':sayKm(d)}
function pvKmTxt(n){return String(Math.round(n*10)/10).replace('.',' vírgula ')}
function provaTick(){
  var P=run.prova;if(!P||run.state!=='running')return;
  /* alerta: ritmo muito mais rápido que o necessário (risco de quebrar) */
  if(!run.pvDone&&run.elapsed>=45&&run.elapsed-run.lastAlertT>=120&&run.elapsed-run.lastKmT>=15){
    var cp=curPace(),st=pvState();
    if(cp>0){
      var lp=pvPaceAt(P,run.dist),faster=lp-cp;
      if(faster>lp*0.07||(st.dsec>45&&faster>lp*0.03)){
        run.lastAlertT=run.elapsed;run.alertN++;
        speak((run.alertN>1?'De novo! ':'Alerta! ')+'Você está correndo a '+sayDur(cp)+' por quilômetro, '+pvSecs(faster)+' mais rápido que o pace alvo de '+sayDur(lp)+'. Reduza agora! Quem abre rápido demais quebra no final.');
      }
    }
  }
  if(!run.pvDone&&run.dist>=P.km*1000){
    run.pvDone=true;
    speak('Distância da prova concluída! Tempo '+sayDur(run.elapsed)+'. Meta, '+sayDur(P.sec)+'. '+(run.elapsed<=P.sec?'Meta batida por '+sayDur(P.sec-run.elapsed)+'. Excelente trabalho! Toque em finalizar.':'Faltou '+sayDur(run.elapsed-P.sec)+' para a meta. Toque em finalizar.'));
  }
}
function checkKm(){
  while(run.dist>=(run.splits.length+1)*1000){
    var target=(run.splits.length+1)*1000;
    var f=(target-run.prevD)/Math.max(run.dist-run.prevD,0.001);
    var t=run.prevT+f*(run.elapsed-run.prevT), sp=t-run.lastSplitT;
    run.splits.push(sp);run.lastSplitT=t;
    var k=run.splits.length;
    var ev=kmElevTxt(k),prev=run.splits.length>1?run.splits[run.splits.length-2]:0;
    run.lastKmT=run.elapsed;
    if(run.prova){
      var P=run.prova,left=Math.round(P.km-k),extra='';
      if(k>=P.km){extra=''}
      else if(left===1)extra=' Último quilômetro! Dê tudo!';
      else if(left===5||(P.km>=20&&left===10))extra=' Faltam '+left+' quilômetros. Foco!';
      else if(k===Math.floor(P.km/2))extra=' Metade da prova.';
      speak('Resumo do quilômetro '+k+'. Parcial, '+sayDur(sp)+'. Tempo total, '+sayDur(t)+'. O ideal para este ponto é '+sayDur(pvTAt(P,k*1000))+'.'+ev+' '+(k<P.km?pvVerdict():'')+extra);
    }else{
      var cmp=prev?(sp<prev-2?' '+pvSecs(prev-sp)+' mais rápido que o quilômetro anterior.':sp>prev+2?' '+pvSecs(sp-prev)+' mais lento que o quilômetro anterior.':' Mesmo ritmo do quilômetro anterior.'):'';
      speak('Resumo do quilômetro '+k+'. Parcial, '+sayDur(sp)+'. Tempo total, '+sayDur(t)+'. Pace médio, '+sayDur(t/k)+' por quilômetro.'+cmp+ev);
    }
    if(tab==='live')render();
  }
  run.prevD=run.dist;run.prevT=run.elapsed;
}
function startRun(mode){
  run=newRun();run.mode=mode;
  if(PVM.on){
    var q=pvNum();
    if(!(q.k>0&&q.k<=100)||!(q.s>0)){run.err='Modo prova: informe a distância (km) e o tempo-alvo, por exemplo 55:00.';return}
    var pc=q.s/q.k;
    if(pc<120||pc>720){run.err='Modo prova: o pace-alvo ficou fora do possível. Confira distância e tempo.';return}
    run.prova={km:q.k,sec:q.s,pace:pc};if(PVM.strat)run.prova.cum=stratCum(q.k,q.s);S.prova={km:PVM.km,dur:PVM.dur};save();
  }
  if(mode==='gps'){
    if(!navigator.geolocation){run.err='Este navegador não oferece GPS. Use o modo demonstração.';return}
    try{run.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000,background:true})}
    catch(e){run.err='Não foi possível acessar o GPS. Use o modo demonstração.';return}
  }
  planBegin(run,mode);
  run.state='running';run.segStart=Date.now();run.fix=(mode==='demo');
  if(mode==='demo')run.pts.push({x:0,y:0,d:0,z:30});
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){run.wl=l},function(){})}catch(e){}
  clearInterval(liveTimer);liveTimer=setInterval(tick,250);
  if(run.plan)setTimeout(function(){speak('Rota planejada de '+sayKm(run.plan.km*1000)+'. Tempo estimado, '+sayDur(run.plan.sec)+', no pace de '+sayDur(run.plan.pace)+' por quilômetro.')},run.prova?9000:1800);
  if(run.prova)speak('Modo prova ativado. Meta: '+pvKmTxt(run.prova.km)+' quilômetros em '+sayDur(run.prova.sec)+'. Pace alvo, '+sayDur(run.prova.pace)+' por quilômetro. Largada controlada: não passe do pace alvo nos primeiros dois quilômetros. Vamos!');
  else speak('Corrida iniciada. Boa corrida!');
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&run&&run.state==='running'&&run.mode==='gps'){try{tick()}catch(e){}}});
function onPos(p){
  if(run.state!=='running'&&run.state!=='paused')return;
  var c=p.coords;
  run.acc=Math.round(c.accuracy||0);
  if(c.accuracy>35)return;
  var pt={lat:c.latitude,lon:c.longitude,t:p.timestamp};
  if(!run.origin){run.origin=pt;run.pts.push({x:0,y:0,d:0,z:(c.altitude!=null&&c.altitudeAccuracy!=null&&c.altitudeAccuracy<=30)?c.altitude:null})}
  run.fix=true;
  if(run.last){
    var d=hav(run.last,pt), dt=(pt.t-run.last.t)/1000;
    if(d<1.5)return;
    if(dt>0&&d/dt>12)return;
    if(run.state==='running'){
      run.elapsed=run.accBefore+(Date.now()-run.segStart)/1000;
      run.dist+=d;sample();checkKm();
    }
  }
  run.last=pt;
  var o=run.origin;
  run.pts.push({x:(pt.lon-o.lon)*111320*Math.cos(o.lat*Math.PI/180),y:(pt.lat-o.lat)*110540,d:run.dist,z:(c.altitude!=null&&(c.altitudeAccuracy==null||c.altitudeAccuracy<=30))?c.altitude:null});
  updateLive();
}
function onPosErr(e){
  if(e&&e.code===1){
    clearInterval(liveTimer);liveTimer=null;
    if(run.watch!=null){try{navigator.geolocation.clearWatch(run.watch)}catch(x){}}
    var m='A localização está bloqueada ou foi negada. Neste protótipo o GPS pode não estar disponível. Use o modo demonstração para ver como funciona.';
    run=newRun();run.err=m;
    if(tab==='live')render();
  }else{
    run.fix=false;updateLive();
  }
}
function tick(){
  if(run.state!=='running'){updateLive();return}
  if(run.mode==='demo'&&run.plan&&run.plan.cum){
    var Pl=run.plan,dt0=0.25*MULT,ds0=(Pl.km*1000/Pl.sec)*dt0*(1+0.04*Math.sin(run.elapsed/45));
    run.elapsed+=dt0;run.dist=Math.min(Pl.km*1000,run.dist+ds0);
    var pp=planPos(Pl,run.dist/(Pl.km*1000));run.sim.x=pp.x;run.sim.y=pp.y;
    run.pts.push({x:pp.x,y:pp.y,d:run.dist,z:30+22*Math.sin(run.dist/650)+8*Math.sin(run.dist/190)});
    sample();checkKm();
  }else if(run.mode==='demo'){
    var dt=0.25*MULT, pace=BASEPACE+20*Math.sin(run.elapsed/45), ds=(1000/pace)*dt, s=run.sim;
    run.elapsed+=dt;run.dist+=ds;
    s.h+=ds/300+0.01*Math.sin(run.dist/90);
    s.x+=Math.cos(s.h)*ds;s.y+=Math.sin(s.h)*ds;
    run.pts.push({x:s.x,y:s.y,d:run.dist,z:30+22*Math.sin(run.dist/650)+8*Math.sin(run.dist/190)});
    sample();checkKm();
  }else{
    run.elapsed=run.accBefore+(Date.now()-run.segStart)/1000;
    sample();
  }
  provaTick();planTick();
  updateLive();
}
function pauseRun(){
  if(run.state==='running'){
    if(run.mode==='gps'){run.accBefore=run.accBefore+(Date.now()-run.segStart)/1000;run.elapsed=run.accBefore}
    run.state='paused';speak('Corrida pausada.');
  }else if(run.state==='paused'){
    run.segStart=Date.now();run.state='running';speak('Corrida retomada.');
  }
}
function finishRun(){
  if(run.state==='running'&&run.mode==='gps')run.elapsed=run.accBefore+(Date.now()-run.segStart)/1000;
  clearInterval(liveTimer);liveTimer=null;
  if(run.watch!=null){try{navigator.geolocation.clearWatch(run.watch)}catch(e){}run.watch=null}
  if(run.wl){try{run.wl.release()}catch(e){}run.wl=null}
  run.state='done';run.el=elevStats();
  var avg=run.dist>=20?' Pace médio, '+sayDur(run.elapsed/(run.dist/1000))+' por quilômetro.':'';
  if(run.prova){
    var P=run.prova,full=run.dist>=P.km*1000-30;
    speak('Prova finalizada. '+sayKm(run.dist)+' em '+sayDur(run.elapsed)+'. '+(full?(run.elapsed<=P.sec?'Meta batida por '+sayDur(P.sec-run.elapsed)+'. Parabéns!':'Você ficou '+sayDur(run.elapsed-P.sec)+' acima da meta. Analise a prova e volte mais forte.'):'Você parou antes da distância da prova.'));
  }else
  speak('Corrida finalizada. '+sayKm(run.dist)+' em '+sayDur(run.elapsed)+'.'+avg);
}
function updateLive(){
  if(tab!=='live')return;
  function set(id,t){var e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t}
  set('lv-dist',(run.dist/1000).toFixed(2).replace('.',','));
  set('lv-time',fmtDur(run.elapsed));
  var cp=curPace();
  set('lv-pace',cp?fmtPace(cp):'–');

function simpleRoute(pts){
  if(!pts||pts.length<4)return null;
  var n=pts.length,step=Math.max(1,Math.ceil(n/80)),o=[];
  for(var i=0;i<n;i+=step)o.push([Math.round(pts[i].x),Math.round(pts[i].y)]);
  var L=pts[n-1];o.push([Math.round(L.x),Math.round(L.y)]);return o;
}

/* ---------- Recordes, sequência, previsão e conquistas ---------- */
function realRuns(list){return (list||S.runs).filter(function(r){return !r.ex})}
function wkKey(ds){return ymd(weekStart(pd(ds)))}
function weekSet(list){var m={};realRuns(list).forEach(function(r){m[wkKey(r.date)]=(m[wkKey(r.date)]||0)+1});return m}
function streakWeeks(list){
  var set=weekSet(list),d=weekStart(new Date()),n=0;
  if(!set[ymd(d)])d.setDate(d.getDate()-7);
  while(set[ymd(d)]){n++;d.setDate(d.getDate()-7)}
  return n;
}
function bestStreak(list){
  var ks=Object.keys(weekSet(list)).sort(),best=0,cur=0,prev=null;
  ks.forEach(function(k){

function plFit(){

  var la=pts.map(function(a){return a[0]}),lo=pts.map(function(a){return a[1]});

  for(z=17;z>3;z--){a=mapWP(mxLa,mnLo,z);b=mapWP(mnLa,mxLo,z);if(b[0]-a[0]<=W-80&&b[1]-a[1]<=H-80)break}

function plRoute(){

  function fallback(){
    PL.line=PL.rt?[og,de,og]:[og,de];PL.km=hav({lat:og[0],lon:og[1]},{lat:de[0],lon:de[1]})/1000*1.25*(PL.rt?2:1);PL.real=false;
  }

    var rt=j&&j.routes&&j.routes[0];

function planBegin(r,mode){
  var og=PL.og;
  if(mode==='demo'&&og)r.origin={lat:og[0],lon:og[1],t:Date.now()};
  if(!(PL.dest&&PL.line&&PL.line.length>1&&PL.km>0&&plTarget()>0))return;
  var tg=plTarget();
  r.plan={rt:PL.rt,km:PL.km,pace:tg,sec:PL.km*tg,line:PL.line.slice(),dest:PL.dest.slice(),done:false,real:PL.real};
  if(mode==='demo'&&r.origin){
    var o=r.origin,cl=Math.cos(o.lat*Math.PI/180);
    r.plan.xy=PL.line.map(function(p){return {x:(p[1]-o.lon)*111320*cl,y:(p[0]-o.lat)*110540}});
    var cum=[0];for(var i=1;i<r.plan.xy.length;i++)cum.push(cum[i-1]+Math.hypot(r.plan.xy[i].x-r.plan.xy[i-1].x,r.plan.xy[i].y-r.plan.xy[i-1].y));
    r.plan.cum=cum;
  }
}
function planPos(P,f){
  var tot=P.cum[P.cum.length-1],t=Math.max(0,Math.min(1,f))*tot,i=1;
  while(i<P.cum.length-1&&P.cum[i]<t)i++;
  var a=P.xy[i-1],b=P.xy[i],seg=P.cum[i]-P.cum[i-1],u=seg>0?(t-P.cum[i-1])/seg:0;
  return {x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u};
}
function planTick(){

  var d=new Date();d.setHours(0,0,0,0);
  if(/depois de amanha/.test(q)){d.setDate(d.getDate()+2);return ymd(d)}
  if(/amanha/.test(q)){d.setDate(d.getDate()+1);return ymd(d)}
  if(/\bhoje\b/.test(q))return ymd(d);
  var m=q.match(/\b(domingo|segunda|terca|quarta|quinta|sexta|sabado)\b/);
  if(m){var diff=(WDN[m[1]]-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return ymd(d)}
  return null;
}
function mqType(q){

  for(var i=0;i<syn.length;i++)if(q.indexOf(syn[i][0])>-1)return tr(syn[i][1]);

}
function mqRuns(){return S.runs.filter(function(r){return r.km>0&&r.sec>0}).sort(function(a,b){return a.date.localeCompare(b.date)})}
function mqLv(){return S.acct&&LV[S.acct.level]?LV[S.acct.level]:null}
function mqAvgKm(){var l=mqRuns().slice(-6);if(l.length)return sum(l,function(r){return r.km})/l.length;var lv=mqLv();return lv?lv.km/lv.runs:4}
function mqBasePace(){
  var p=parseDur(normPace(S.pace||''));if(p>0)return p;
  var l=mqRuns().slice(-6);if(l.length)return sum(l,function(r){return r.sec})/sum(l,function(r){return r.km});
  var lv=mqLv();return lv?parseDur(lv.pace):420;

  var offs={2:[1,4],3:[1,3,6],4:[1,3,5,7],5:[1,2,4,5,7]}[n]||[1,3,6];
  var K=L==='ini'

    :L==='ava'
    ?{2:['Tempo run','Longão'],3:['Tempo run','Intervalado','Longão'],4:['Rodagem','Intervalado','Tempo run','Longão'],5:['Rodagem','Intervalado','Regenerativo','Tempo run','Longão']}

function mqTypewriter(){

function mqParseRun(text){
  var raw=String(text||''),q=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var previous=mq.turns.length>1?mq.turns[mq.turns.length-2]:null;
  var intent=/(registr|salv|adicion|anot|fiz uma corrida|fiz corrida|corri|terminei a corrida|acabei de correr)/.test(q)||!!(previous&&previous.role==='assistant'&&previous.content.indexOf('Consigo registrar sua corrida!')===0);
  if(!intent)return null;
  var dm=q.match(/(\d+(?:[.,]\d+)?)\s*(?:km|quilometros?)(?!\w)/i);
  var km=dm?Number(dm[1].replace(',','.')):0;
  var sec=0, tm=q.match(/(?:em|tempo(?: total)?|duracao(?: total)?|durou)\s*(\d{1,2}:\d{2}(?::\d{2})?)/i);
  if(!tm)tm=q.match(/\b(\d{1,2}:\d{2}:\d{2})\b/);
  if(!tm)tm=q.match(/\b(\d{1,2}:\d{2})\b/);
  if(tm)sec=parseDur(tm[1]);
  if(!sec){
    var hm=q.match(/\b(\d+(?:[.,]\d+)?)\s*h(?:oras?)?(?:\s*(\d+)\s*(?:m|min(?:utos?)?))?\b/);
    if(hm)sec=Math.round(Number(hm[1].replace(',','.'))*3600)+Number(hm[2]||0)*60;
    else{
      var mm=q.match(/\b(\d+)\s*(?:min|minuto|minutos)\b/);
      if(mm)sec=Number(mm[1])*60;
    }
  }
  var d=new Date(),date=ymd(d),yd=q.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\b/);
  if(/\bontem\b/.test(q)){d.setDate(d.getDate()-1);date=ymd(d)}
  else if(yd){var yy=Number(yd[3]||d.getFullYear()),mo=Number(yd[2]),da=Number(yd[1]),test=new Date(yy,mo-1,da);if(test.getFullYear()===yy&&test.getMonth()===mo-1&&test.getDate()===da)date=ymd(test)}
  return {intent:true,km:km,sec:sec,date:date};
}
async function mqSend(text){
  text=String(text||'').trim();
  if(mq.busy||mq.wait||!text)return;
  mq.err='';
  var ctl=new AbortController();
  mq.ctl=ctl;mq.busy=true;mq.live='';
  mq.turns.push({role:'user',content:text});
  mq.fresh=mq.turns.length-1;saveChat();render();mq.fresh=1e9;scrollEnd();
  var messages=mq.turns.slice(-16).map(function(m){return {role:m.role,content:m.content}});
  try{
    var parsedRun=mqParseRun(text);
    if(parsedRun){
      var missing=[];if(!(parsedRun.km>0&&parsedRun.km<=300))missing.push('distância em km');if(!(parsedRun.sec>0&&parsedRun.sec<=86400))missing.push('tempo total (por exemplo, 28:30 ou 30 minutos)');
      if(missing.length){mq.turns.push({role:'assistant',content:'Consigo registrar sua corrida! Só preciso que você informe '+missing.join(' e ')+'. Exemplo: “Registre 5 km em 28:30 hoje”.'});}
      else{mq.turns.push({role:'assistant',content:'Confira os dados antes de salvar: '+fmtKm(parsedRun.km)+' km em '+fmtDur(parsedRun.sec)+', em '+fmtDay(parsedRun.date)+'. A corrida só entra no seu histórico quando você confirmar.',btns:[{k:'recordRun',l:'Salvar corrida no histórico',p:{date:parsedRun.date,km:parsedRun.km,sec:parsedRun.sec}}],chips:['Quero analisar meu pace','Como estou na meta do mês?']});}
      mq.fresh=mq.turns.length-1;return;
    }
    var response=await fetch(COACH_API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:RULES,context:mqCtx(),messages:messages}),
      signal:ctl.signal
    });
    var data=await response.json().catch(function(){return {}});
    if(!response.ok)throw new Error(data.message||'Não consegui conectar ao Treinador IA. Tente novamente.');
    if(!data.text||typeof data.text!=='string')throw new Error('O Treinador IA não retornou uma resposta. Tente novamente.');
    mq.turns.push({role:'assistant',content:data.text,acts:[]});
    mq.fresh=mq.turns.length-1;
  }catch(e){
    if(e&&e.name==='AbortError')mq.err='Resposta cancelada.';
    else mq.err=e&&e.message?e.message:'Falha de conexão com o Treinador IA.';
  }finally{
    mq.busy=false;mq.live='';mq.ctl=null;saveChat();render();mq.fresh=1e9;scrollEnd();
  }
}

    h+='<p class="ob-err" role="alert">'+esc(ob.err)+'</p><button class="ob-btn" data-act="obdone">Começar a correr</button><button class="ob-link" data-act="obback">‹ Voltar</button>';
  }
  return h+'</div>';
}
function renderOnb(){var el=document.getElementById('onb');if(!el)return;el.hidden=false;el.innerHTML=onbHTML();el.scrollTop=0}
function obStep1(){
  var n=ob.name.trim();
  if(n.length<2)return 'Informe seu nome.';
  if(ob.user.length<3)return 'O nome de usuário precisa de 3 a 20 caracteres (letras, números, ponto ou _).';

}
function obFinish(){
  var lv=LV[ob.level],pace=ob.pace.trim(),km=num(ob.km);
  if(!lv)return 'Escolha seu nível.';
  if(pace&&!(parseDur(normPace(pace))>0))return 'Pace inválido. Use o formato 6:30.';
  if(!(km>0&&km<=2000))return 'Informe a meta mensal em km.';
  var b0=0;RANKS.forEach(function(r){if(r.t===ob.level&&r.d==='I')b0=r.min});
  S.acct={name:ob.name.trim(),user:ob.user,email:ob.email.trim().toLowerCase(),level:ob.level,created:todayStr,base:b0,rank:rankIdxFor(b0)};
  S.me={nick:S.acct.name,bio:(S.me&&S.me.bio)||''};
